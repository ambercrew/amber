name: "publish"

on:
  push:
    branches: ["release"]

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # git-cliff needs the full history and all tags to work out what changed
      # since the previous release.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      # Renders the commits since the last tag into RELEASE_NOTES.md. The tag for
      # this release does not exist yet, so --unreleased --tag names it up front.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        id: create-release
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.tag_name == "v${{ steps.version.outputs.version }}") | .id')
          if [ -z "$id" ]; then
            id=$(jq -n \
              --rawfile body RELEASE_NOTES.md \
              --arg tag "v${{ steps.version.outputs.version }}" \
              --arg name "Amber v${{ steps.version.outputs.version }}" \
              '{tag_name: $tag, name: $name, target_commitish: "release", body: $body, draft: true}' \
              | gh api repos/${{ github.repository }}/releases --input - --jq '.id')
          else
            # Re-run against an existing draft: refresh the notes in place.
            jq -n --rawfile body RELEASE_NOTES.md '{body: $body}' \
              | gh api --method PATCH "repos/${{ github.repository }}/releases/$id" --input - >/dev/null
          fi
          echo "id=$id" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
            # Linux builds with the CEF runtime, which only the feat/cef fork of
            # the Tauri CLI knows how to bundle. See the install step below.
            tauriScript: "cargo tauri"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    # Must match the `tauri` revision resolved in src-tauri/Cargo.lock. The npm
    # `@tauri-apps/cli` is upstream and has no CEF support, so the Linux job
    # builds the CLI from the same fork the crates are patched to.
    env:
      TAURI_CLI_REV: 64606e20f18c7dafa73426c282a750f91e8219e6
    steps:
      - uses: actions/checkout@v5
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-latest' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The AppImage/deb/rpm bundlers only ship libcef.so and the CEF resource
      # files when the CLI resolves a `cef_path`, which upstream cannot do.
      - name: cache tauri CLI (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        id: tauri-cli-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-${{ env.TAURI_CLI_REV }}

      - name: install tauri CLI from feat/cef fork (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' && steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/tauri-apps/tauri \
            --rev "$TAURI_CLI_REV" tauri-cli --locked

      - name: install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          # Empty on macOS/Windows, which fall back to the npm CLI.
          tauriScript: ${{ matrix.tauriScript }}

      # Producing snap file
      # - name: install snapcraft
      #   if: matrix.platform == 'ubuntu-24.04'
      #   run: sudo snap install snapcraft --classic

      # - name: sync snapcraft version
      #   if: matrix.platform == 'ubuntu-24.04'
      #   run: |
      #     sed -i "s/^version: .*/version: '${{ needs.create-release.outputs.version }}'/" snapcraft.yaml

      # - name: build snap
      #   if: matrix.platform == 'ubuntu-24.04'
      #   env:
      #     TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      #     TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      #     STORE_BUILD: "1"
      #   run: sudo -E snapcraft pack --destructive-mode

      # - name: fix snapcraft permissions
