      # To generate new credentials `snapcraft export-login --snaps amber --channels stable -`
      # - name: publish snap to store
      #   if: matrix.platform == 'ubuntu-24.04'
      #   env:
      #     SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      #   run: |
      #     output=$(snapcraft upload *.snap --release=stable 2>&1) && echo "$output" || {
      #       echo "$output"
