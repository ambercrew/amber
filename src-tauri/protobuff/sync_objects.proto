syntax = "proto3";

package generated_code;

message CellChange {
  string tbl = 1;
  string row_id = 2;
  string col = 3;
  optional bytes value = 4;
  string hlc = 5;
  string device_id = 6;
}

message ChangeBatch {
  repeated CellChange cells = 1;
}

message PullResponse {
  repeated CellChange cells = 1;
  int64 next_server_seq = 2;
  bool has_more = 3;
}

