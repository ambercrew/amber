[package]
name = "Amber"
version = "1.0.0"
description = "Amber"
authors = ["Rami Alkawadri"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amber_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
tauri-build = { version = "2", features = [] }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "macros", "sqlite" ] }
tokio = { version = "1.53.1", features = ["full"] }

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.91"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
cookie_store = "0.22.1"
injector = { path = "./injector" }
injector_derive = { path = "./injector_derive" }
log = "0.4.33"
markdown = "1.0.0"
pdf_oxide = "0.3.77"
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.2"
regex = "1.13.1"
tauri-plugin-http = "2.5.9"
reqwest-middleware = { version = "0.4", features = ["json"] }
reqwest-retry = "0.8"
reqwest_cookie_store = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
tauri-plugin-log = "2.8.0"
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "macros", "sqlite", "chrono", "uuid" ] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2"
tauri-plugin-process = "2.3.1"
thiserror = "2.0.19"
tokio = { version = "1.51.0", features = ["full"] }
tokio-stream = "0.1.19"
uuid = { version = "1.24.0", features = [ "v4", "serde" ] }
fractional_index = "2.0.2"
fsrs = "6.6.1"
rig = { version = "=0.41.0", default-features = false, features = ["pdf", "derive", "native-tls", "sqlite", "agent"] }
schemars = "1.2.2"
text-splitter = "0.32.0"
sqlite-vec = "0.1.9"
tokio-rusqlite = "0.6.0"
fontdb = "0.23.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"

# No default runtime feature on purpose: every platform states its runtime
# explicitly via its own tauri.<platform>.conf.json ("build.features"),
# e.g. tauri.linux.conf.json -> ["cef"], tauri.windows.conf.json -> ["wry"].
# Relying on a Cargo "default" feature here is fragile — it only gets
# stripped from a platform's build if that platform's invocation happens to
# pass `--no-default-features` (true for `tauri dev`/`build` via a platform
# config override, NOT true for `tauri android build`), so a default would
# silently combine with whatever a platform opts into via config.
#
# Do NOT enable "cef" directly on a per-target dependency table — `tauri
# build`/`tauri dev` normalizes the "tauri" dependency's features across
# all target-cfg tables and will silently copy it into every table.
[dependencies.tauri]
version = "2"
default-features = false
features = [
  "test",
]

[dev-dependencies]
mockall = "0.15.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"

[features]
store = []
wry = ["tauri/wry"]
cef = ["tauri/cef"]

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "*", features = ["vendored"] }

# Redirect every crates.io consumer of tauri (your app AND all
# tauri-plugin-* crates) to the feat/cef branch. Replace `rev` with the
# current HEAD of feat/cef and keep it pinned — the branch moves fast.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }

tauri-plugin-http              = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-fs                = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-log               = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-clipboard-manager = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-dialog            = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-opener            = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-os                = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-process           = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-single-instance   = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-updater           = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }
tauri-plugin-window-state      = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "feat/cef" }

[workspace]
members = [
    "injector",
    "injector_derive"
]
