[package]
name = "Amber"
version = "1.0.0"
description = "Amber"
authors = ["Rami Alkawadri"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "amber_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
tauri-build = { version = "3.0.0-alpha.4", features = [] }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "macros", "sqlite" ] }
tokio = { version = "1.53.1", features = ["full"] }

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
injector = { path = "./injector" }
injector_derive = { path = "./injector_derive" }
log = "0.4.34"
markdown = "1.0.0"
pdf_oxide = "0.3.78"
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.3"
regex = "1.13.1"
tauri-plugin-http = "3.0.0-alpha.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration"] }
reqwest-middleware = { version = "0.4", features = ["json"] }
reqwest-retry = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_repr = "0.1.21"
tauri-plugin-log = "3.0.0-alpha.3"
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "macros", "sqlite", "chrono", "uuid" ] }
tauri-plugin-clipboard-manager = "3.0.0-alpha.3"
# Dialog backend is picked per runtime below: CEF uses GTK 4, which cannot share a process with GTK 3.
tauri-plugin-dialog = { version = "3.0.0-alpha.4", default-features = false }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
uuid = { version = "1.26.1", features = [ "v4", "serde" ] }
fractional_index = "2.0.2"
fsrs = "6.6.2"
rig = { version = "=0.42.0", default-features = false, features = ["pdf", "derive", "native-tls", "sqlite", "agent"] }
schemars = "1.2.2"
text-splitter = "0.33.0"
sqlite-vec = "0.1.9"
tokio-rusqlite = "0.6.0"
fontdb = "0.24.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
sha2 = "0.11.0"

# No default runtime feature on purpose: every platform states its runtime
# explicitly via its own tauri.<platform>.conf.json ("build.features"),
# e.g. tauri.linux.conf.json -> ["cef"], tauri.windows.conf.json -> ["wry"].
# Relying on a Cargo "default" feature here is fragile — it only gets
# stripped from a platform's build if that platform's invocation happens to
# pass `--no-default-features` (true for `tauri dev`/`build` via a platform
# config override, NOT true for `tauri android build`), so a default would
# silently combine with whatever a platform opts into via config.
#
# The runtime is its own crate (not a `tauri` feature) since Tauri v3; each
# feature pulls one in and `lib.rs` selects it on the builder.
[dependencies.tauri]
version = "3.0.0-alpha.5"
default-features = false
features = [
  "test",
]

[dependencies.tauri-runtime-wry]
version = "3.0.0-alpha.5"
default-features = false
optional = true

[dependencies.tauri-runtime-cef]
version = "3.0.0-alpha.6"
optional = true

[dev-dependencies]
mockall = "0.15.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-window-state = "3.0.0-alpha.2"

[features]
store = []
wry = ["dep:tauri-runtime-wry", "tauri-plugin-dialog/gtk3"]
cef = ["dep:tauri-runtime-cef", "tauri-plugin-dialog/xdg-portal"]

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "*", features = ["vendored"] }

[workspace]
members = [
    "injector",
    "injector_derive"
]
